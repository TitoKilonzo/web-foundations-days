<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <header class="top">
        <h1>Live Character Counter</h1>
        <button type="button" id="theme-toggle">Dark mode</button>
      </header>

      <p class="intro">
        Write a note and watch the counters update as you type. Your draft is
        saved on this device, so it will still be here when you come back.
      </p>

      <label for="note-text">Your note</label>
      <textarea
        id="note-text"
        rows="8"
        placeholder="Start typing your note..."
      ></textarea>

      <div class="stats">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button type="button" id="clear-btn">Clear</button>
        <span class="hint">Tip: press Esc inside the box to clear it.</span>
      </div>
    </main>
  </body>
</html>
