<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <script src="users.js" defer></script>
    <style>
      body {
        max-width: 700px;
        margin: 0 auto;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
      }
      #users-list {
        list-style: none;
        padding: 0;
      }
      .user-card {
        margin-bottom: 12px;
        padding: 12px 16px;
        border: 1px solid #c9d3d8;
        border-left: 6px solid #2f4858;
        border-radius: 8px;
      }
      .user-card h2 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      .user-card p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>User Directory</h1>

    <button type="button" id="load-users">Load users</button>

    <p>
      <label for="filter-input">Filter by name</label><br />
      <input type="text" id="filter-input" placeholder="Start typing a name..." />
    </p>

    <p id="status"></p>
    <ul id="users-list"></ul>
  </body>
</html>
